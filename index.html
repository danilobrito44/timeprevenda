<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growth, Pré-Venda e Inovação — SOS Docs</title>
<meta name="description" content="Painel do time de Growth, Pré-Venda e Inovação da SOS Docs: pessoas, projetos e tarefas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #0B0908; --panel: #15110E; --panel2: #1D1814; --deep: #110E0C;
    --line: #262019; --line2: #332A23; --ink: #F3EEE9; --ink2: #CFC6BE; --mute: #A39A92; --mute2: #7D736B;
    --accent: #FF7A4D; --accent2: #FF9C78;
    --cli: #5EE3A1; --ino: #B69CFF; --mkt: #FFB547; --int: #6FD4E8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Manrope', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .disp { font-family: 'Sora', 'Manrope', system-ui, sans-serif; letter-spacing: -0.02em; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  img { max-width: 100%; }

  .glow { position: fixed; top: -260px; left: 4%; width: 720px; height: 500px; max-width: 90vw; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255,122,77,.14), rgba(255,122,77,0)); }

  .shell { position: relative; display: flex; min-height: 100vh; }
  .rail { position: sticky; top: 0; height: 100vh; width: 96px; flex: 0 0 96px; display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 24px 0; border-right: 1px solid #1E1915; background: #0E0B0A; }
  .logo { width: 62px; margin-bottom: 20px; opacity: .9; }
  .brandbar { display: flex; align-items: center; gap: 18px; }
  .brandbar img { height: 30px; }
  .vr { width: 1px; height: 42px; background: #2A231E; }
  @media (max-width: 760px) { .brandbar { flex-direction: column; align-items: flex-start; gap: 10px; } .brandbar img { height: 22px; } .vr { display: none; } }
  .navbtn { width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; border-radius: 16px; font-size: 11px; font-weight: 600; color: var(--mute2); transition: background-color .2s, color .2s; }
  .navbtn:hover { color: var(--ink); }
  .navbtn.on { background: rgba(255,122,77,.14); color: var(--accent2); }

  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding: 24px 36px 14px; }
  .h1 { font-size: clamp(20px, 3vw, 26px); font-weight: 600; }
  .sub { font-size: 14px; color: var(--mute); }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; }
  .chipline { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--ink2); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .content { padding: 6px 36px 40px; display: flex; flex-direction: column; gap: 18px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 20px 22px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1.1fr 1fr; gap: 16px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; align-items: start; }
  .grid5 { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 14px; }
  .kpi { display: flex; align-items: center; gap: 16px; }
  .kpi b { font-size: 40px; font-weight: 600; line-height: 1; font-family: 'Sora', sans-serif; }
  .kpi span { font-size: 13px; color: var(--mute); }
  .ttl { font-size: 17px; font-weight: 600; }

  .row { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 16px; border: 1px solid transparent; transition: background-color .2s, border-color .2s; width: 100%; }
  .row:hover { background: var(--panel2); }
  .rowdeep { background: var(--deep); border-color: #221C18; }
  .rowdeep.sel { border-color: var(--accent); background: #221B16; }
  .bar { width: 4px; height: 34px; border-radius: 4px; flex: 0 0 auto; }
  .grow1 { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .t14 { font-size: 14px; font-weight: 700; line-height: 1.3; }
  .t12 { font-size: 12px; color: var(--mute); }
  .pill { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: #221B16; color: var(--ink2); white-space: nowrap; }
  .due { width: 100px; flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .due b { font-size: 14px; font-weight: 600; font-family: 'Sora', sans-serif; }
  .ava { border-radius: 50%; object-fit: cover; flex: 0 0 auto; }
  .stack { display: flex; }
  .stack img { width: 28px; height: 28px; margin-left: -6px; box-shadow: 0 0 0 2px var(--deep); }
  .track { flex: 1 1 auto; height: 22px; display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: #0F0C0A; }
  .seg { height: 100%; border-radius: 6px; transition: width .9s cubic-bezier(.2,.8,.2,1); }

  .person { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 26px 16px 20px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; transition: transform .25s, border-color .25s, background-color .25s; }
  .person:hover { transform: translateY(-3px); border-color: #3A2F27; background: #1B1612; }
  .person img { width: 110px; height: 110px; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px #2E2620; transition: box-shadow .3s; }
  .person:hover img { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
  .role { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: #221B16; color: var(--ink2); }

  .bars { position: relative; height: 190px; display: flex; align-items: flex-end; justify-content: space-around; }
  .bars .line { position: absolute; left: 0; right: 0; height: 1px; background: #1E1915; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .colstack { width: 54px; display: flex; flex-direction: column-reverse; gap: 3px; }
  .colstack div { width: 100%; border-radius: 8px; transition: height .9s cubic-bezier(.2,.8,.2,1); }
  .ring circle { transition: stroke-dasharray .9s cubic-bezier(.2,.8,.2,1), stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1); }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .scrim { position: fixed; inset: 0; background: rgba(6,4,3,.62); backdrop-filter: blur(2px); z-index: 20; animation: fade .3s ease both; }
  .drawer { position: fixed; top: 16px; right: 16px; bottom: 16px; width: min(440px, calc(100vw - 32px)); z-index: 21; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line2); border-radius: 28px; padding: 24px; box-shadow: 0 30px 80px rgba(0,0,0,.5);
    display: flex; flex-direction: column; gap: 18px; animation: slidein .45s cubic-bezier(.2,.8,.2,1) both; }
  .lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--mute2); }
  .box { background: var(--panel2); border-radius: 20px; padding: 16px 18px; }
  .task { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; color: #E3DCD5; }
  .task i { width: 7px; height: 7px; border-radius: 50%; margin-top: 7px; flex: 0 0 auto; }
  .close { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: var(--panel2); }

  .fade-in { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slidein { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .tabbar { display: none; }
  @media (max-width: 1100px) {
    .grid3 { grid-template-columns: 1fr; }
    .grid4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .grid2 { grid-template-columns: 1fr; }
    .grid5 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  }
  @media (max-width: 760px) {
    .rail { display: none; }
    header.top { padding: 18px 18px 10px; }
    .legend { gap: 6px; flex-wrap: nowrap; overflow-x: auto; width: 100%; scrollbar-width: none; }
    .legend::-webkit-scrollbar { display: none; }
    .chipline { flex: 0 0 auto; }
    .chipline { height: 30px; font-size: 11px; padding: 0 11px; }
    .content { padding: 4px 18px 96px; }
    .grid5 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .card { padding: 16px; border-radius: 20px; }
    .kpi b { font-size: 30px; }
    .due { width: auto; }
    .hide-sm { display: none !important; }
    .drawer { top: auto; right: 0; left: 0; bottom: 0; width: 100%; max-height: 88vh; border-radius: 24px 24px 0 0; animation: up .4s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes up { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: none; } }
    .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; gap: 6px; padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
      background: #0E0B0A; border-top: 1px solid #1E1915; }
    .tabbar button { flex: 1 1 0; height: 56px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--mute2); }
    .tabbar button.on { background: rgba(255,122,77,.14); color: var(--accent2); }
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="shell">
  <nav class="rail" id="rail"></nav>
  <div class="main">
    <header class="top">
      <div class="brandbar">
        <img src="" id="brandlogo" alt="Grupo SOS Docs">
        <span class="vr"></span>
        <div>
          <div class="disp h1">Growth, Pré-Venda e Inovação</div>
          <div class="sub" id="subtitle"></div>
        </div>
      </div>
      <div class="legend" id="legend"></div>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="overlay"></div>

}

function donutSvg() {
  var total = PROJECTS.length, C = 2 * Math.PI * 72, cum = 0, segs = '';
  FRENTES.forEach(function (f) {
    var c = PROJECTS.filter(function (q) { return q.frente === f.id; }).length, frac = c / total;
    segs += '<circle cx="95" cy="95" r="72" fill="none" stroke="' + f.color + '" stroke-width="24" stroke-dasharray="' +
      Math.max(frac * C - 4, .01) + ' ' + C + '" stroke-dashoffset="' + (-cum * C) + '" transform="rotate(-90 95 95)"/>';
    cum += frac;
  });
  return '<svg class="ring" viewBox="0 0 190 190" width="100%" height="100%"><circle cx="95" cy="95" r="72" fill="none" stroke="#221B16" stroke-width="24"/>' + segs + '</svg>';
}

  ].map(function (b) {

  g3.appendChild(c2);

  var ds = PROJECTS.filter(function (q) { return !!q.due; }).sort(byDue);
  var n0 = ds[0], nd = days(n0.due), NC = 2 * Math.PI * 56, frac = Math.max((60 - Math.min(nd, 60)) / 60, .04);
  var next3 = ds.slice(1, 4).map(function (q) {
    var d = new Date(q.due + 'T00:00:00');
    return '<button class="row" data-p="' + q.id + '" style="flex:1 1 0;flex-direction:column;gap:4px;background:var(--panel2);padding:10px 6px;text-align:center">' +
      '<span class="disp" style="font-size:18px;font-weight:600">' + d.getDate() + '</span>' +
      '<span style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--accent2)">' + MES[d.getMonth()] + '</span>' +
      '<span style="font-size:11px;font-weight:600;color:var(--ink2)">' + esc(q.org) + '</span></button>';
  }).join('');
  var c3 = $('<div class="card fade-in" style="animation-delay:280ms"><div class="disp ttl">Próxima entrega</div>' +
    '<button class="row" data-p="' + n0.id + '" style="margin-top:10px;padding:6px">' +
    '<span style="position:relative;width:118px;height:118px;flex:0 0 auto"><svg class="ring" viewBox="0 0 132 132" width="100%" height="100%">' +
    '<circle cx="66" cy="66" r="56" fill="none" stroke="#221B16" stroke-width="12"/>' +
    '<circle cx="66" cy="66" r="56" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (frac * NC) + ' ' + NC + '" transform="rotate(-90 66 66)"/></svg>' +
    '<span class="center"><span class="disp" style="font-size:32px;font-weight:600;line-height:1">' + nd + '</span><span class="t12">dias</span></span></span>' +
    '<span class="grow1"><span class="lbl" style="color:var(--accent2)">' + esc(n0.org) + '</span>' +
    '<span class="disp" style="font-size:16px;font-weight:600;line-height:1.3">' + esc(n0.name) + '</span>' +
    '<span class="t12">Entrega ' + fd(n0.due) + ' · ' + esc(FR_BY[n0.frente].label) + '</span></span></button>' +
    '<div style="display:flex;gap:8px;margin-top:10px">' + next3 + '</div></div>');
  g3.appendChild(c3);
  wrap.appendChild(g3);

  var maxLoad = Math.max.apply(null, PEOPLE.map(function (p) { return projsOf(p.id).length; }));
  var load = $('<div class="card fade-in" style="animation-delay:340ms"><div style="display:flex;justify-content:space-between;align-items:center"><div class="disp ttl">Carga do time</div><div class="t12 hide-sm">um bloco por projeto, na cor da frente</div></div></div>');
  PEOPLE.forEach(function (p) {
    var ps = projsOf(p.id).slice().sort(function (a, b) { return a.frente < b.frente ? -1 : 1; });
    var segs = ps.map(function (q) { return '<span class="seg" style="width:0;background:' + FR_BY[q.frente].color + '" data-w="' + (100 / maxLoad - 1.2) + '%"></span>'; }).join('');
    var b = $('<button class="row"><img class="ava" src="' + p.photo + '" alt="" style="width:40px;height:40px">' +
      '<span style="width:160px;flex:0 0 auto;display:flex;flex-direction:column"><span class="t14">' + esc(p.name) + '</span><span class="t12 hide-sm">' + esc(p.role) + '</span></span>' +
      '<span class="track">' + segs + '</span><b class="disp" style="width:28px;text-align:right;font-size:20px">' + ps.length + '</b></button>');
    b.onclick = function () { go('team', p.id); };
    load.appendChild(b);
  });
  setTimeout(function () { load.querySelectorAll('[data-w]').forEach(function (s) { s.style.width = s.getAttribute('data-w'); }); }, 80);
  wrap.appendChild(load);
  return wrap;
}

/* ---------- projetos ---------- */
function projRow(q, deep) {
  var f = FR_BY[q.frente];
  var av = q.people.map(function (id) { return '<img class="ava" src="' + BY_ID[id].photo + '" alt="">'; }).join('');
  var b = $('<button class="row rowdeep"><span class="bar" style="background:' + f.color + '"></span>' +
    '<span class="grow1"><span class="t14">' + esc(titleOf(q)) + '</span><span class="t12">' + q.tasks.length + ' tarefas</span></span>' +
    '<span class="stack hide-sm">' + av + '</span>' +
    '<span class="due"><b>' + esc(dueText(q)) + '</b><span class="t12">' + esc(leftText(q)) + '</span></span>' + ICON.chevron + '</button>');
  b.onclick = function () { openProj(q.id); };
  return b;
}
function viewProjects() {
  var g = $('<div class="grid2"></div>');
  FRENTES.forEach(function (f, i) {
    var ps = PROJECTS.filter(function (q) { return q.frente === f.id; }).sort(byDue);
    var card = $('<div class="card fade-in" style="animation-delay:' + (i * 80) + 'ms"><div style="display:flex;align-items:center;gap:10px;padding-bottom:8px">' +
      '<span class="dot" style="background:' + f.color + '"></span><span class="disp ttl" style="flex:1">' + esc(f.label) + '</span>' +
      '<span class="t12">' + ps.length + ' projetos</span></div></div>');
    ps.forEach(function (q) { card.appendChild(projRow(q)); });
    g.appendChild(card);
  });
  return g;
}

/* ---------- time ---------- */
function viewTeam() {
  var g = $('<div class="grid5"></div>');
  PEOPLE.forEach(function (p, i) {
    var ps = projsOf(p.id);
    var dots = [];
    ps.forEach(function (q) { if (dots.indexOf(q.frente) < 0) dots.push(q.frente); });
    var b = $('<button class="person fade-in" style="animation-delay:' + (i * 70) + 'ms"><img class="ava" src="' + p.photo + '" alt="' + esc(p.name) + '">' +
      '<span class="disp" style="font-size:17px;font-weight:600">' + esc(p.name) + '</span>' +
      '<span class="role">' + esc(p.role) + '</span><span class="t12" style="color:var(--ink2)">' + ps.length + ' projetos</span>' +
      '<span style="display:flex;gap:4px">' + dots.map(function (d) { return '<span class="dot" style="width:8px;height:8px;background:' + FR_BY[d].color + '"></span>'; }).join('') + '</span></button>');
    b.onclick = function () { go('team', p.id); };
    g.appendChild(b);
  });
  return g;
}
function viewPerson() {
  var p = BY_ID[state.sel], ps = projsOf(p.id), withDate = ps.filter(function (q) { return !!q.due; });
  var frag = document.createDocumentFragment();
  var nav = $('<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"></div>');
  var back = $('<button class="close" aria-label="Voltar para o time" style="border:1px solid var(--line);background:var(--panel)">' + ICON.back + '</button>');
  back.onclick = function () { go('team'); };
  nav.appendChild(back);
  PEOPLE.forEach(function (o) {
    var on = o.id === p.id;
    var c = $('<button class="row" style="width:auto;height:44px;padding:0 14px 0 5px;border-radius:99px;font-size:13px;font-weight:600;background:' +
      (on ? '#2A211B' : 'var(--panel)') + ';border-color:' + (on ? 'var(--accent)' : 'var(--line)') + '">' +
      '<img class="ava" src="' + o.photo + '" alt="" style="width:34px;height:34px">' + esc(o.name.split(' ')[0]) + '</button>');
    c.onclick = function () { go('team', o.id); };
    nav.appendChild(c);
  });
  frag.appendChild(nav);

  var cols = $('<div style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap"></div>');
  cols.appendChild($('<div class="card fade-in" style="flex:0 0 340px;max-width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 22px">' +
    '<img class="ava" src="' + p.photo + '" alt="' + esc(p.name) + '" style="width:124px;height:124px;box-shadow:0 0 0 4px var(--panel),0 0 0 6px var(--accent)">' +
    '<div class="disp" style="font-size:26px;font-weight:600">' + esc(p.name) + '</div>' +
    '<div style="font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;background:rgba(255,122,77,.14);color:var(--accent2)">' + esc(p.role) + '</div>' +
    '<div style="font-size:14px;line-height:1.65;color:var(--ink2)">' + esc(p.desc) + '</div>' +
    '<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px">' + p.skills.map(function (s) { return '<span class="pill" style="font-weight:500">' + esc(s) + '</span>'; }).join('') + '</div>' +
    '<div style="width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px">' +
    '<div class="box"><div class="disp" style="font-size:24px;font-weight:600">' + ps.length + '</div><div class="t12">projetos</div></div>' +
    '<div class="box"><div class="disp" style="font-size:24px;font-weight:600">' + (withDate.length ? fd(withDate[0].due) : '—') + '</div><div class="t12">próxima entrega</div></div></div></div>'));
  var list = $('<div class="card fade-in" style="flex:1 1 380px;animation-delay:80ms"><div style="display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px">' +
    '<div class="disp ttl">Projetos e tarefas</div><div class="t12 hide-sm">Clique para ver o detalhe</div></div></div>');
  ps.forEach(function (q) { list.appendChild(projRow(q)); });
  cols.appendChild(list);
  frag.appendChild(cols);
  return frag;
}

/* ---------- detalhe ---------- */
function renderOverlay() {
  var el = document.getElementById('overlay');
  el.innerHTML = '';
  if (!state.proj) { document.body.style.overflow = ''; return; }
  var q = PROJ_BY[state.proj], f = FR_BY[q.frente];
  document.body.style.overflow = 'hidden';
  var scrim = $('<div class="scrim"></div>');
  scrim.onclick = closeProj;
  var d = $('<aside class="drawer" role="dialog" aria-label="' + esc(titleOf(q)) + '">' +
    '<div style="display:flex;justify-content:space-between;align-items:center">' +
    '<span class="pill" style="display:flex;align-items:center;gap:8px;background:var(--panel2);padding:6px 12px"><span class="dot" style="background:' + f.color + '"></span>' + esc(f.label) + '</span>' +
    '<button class="close" aria-label="Fechar">' + ICON.x + '</button></div>' +
    '<div><div class="lbl" style="color:var(--accent2)">' + esc(q.org) + '</div>' +
    '<div class="disp" style="font-size:25px;font-weight:600;line-height:1.25;margin-top:6px">' + esc(q.name) + '</div></div>' +
    '<div><div class="lbl">Do que se trata</div><div style="font-size:15px;line-height:1.65;color:#E3DCD5;margin-top:8px">' + esc(q.about) + '</div></div>' +
    '<div class="box" style="border:1px solid #2E2620;display:flex;flex-direction:column;gap:10px"><div class="lbl">Tarefas</div>' +
    q.tasks.map(function (t) { return '<div class="task"><i style="background:' + f.color + '"></i><span>' + esc(t) + '</span></div>'; }).join('') + '</div>' +
    (q.next ? '<div><div class="lbl">Próximo passo</div><div style="font-size:14px;line-height:1.55;color:#E3DCD5;margin-top:6px">' + esc(q.next) + '</div></div>' : '') +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
    '<div class="box"><div class="t12">Prazo</div><div class="disp" style="font-size:19px;font-weight:600;margin-top:4px">' + esc(dueText(q)) + '</div></div>' +
    '<div class="box"><div class="t12">Situação</div><div class="disp" style="font-size:19px;font-weight:600;margin-top:4px">' + esc(leftText(q)) + '</div></div></div>' +
    '<div><div class="lbl">Equipe</div><div class="team-row" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div></div></aside>');
  d.querySelector('.close').onclick = closeProj;
  var tr = d.querySelector('.team-row');
  q.people.forEach(function (id) {
    var p = BY_ID[id];
    var b = $('<button class="row" style="width:auto;height:44px;padding:0 14px 0 5px;border-radius:99px;background:#221B16;font-size:13px;font-weight:600">' +
      '<img class="ava" src="' + p.photo + '" alt="" style="width:34px;height:34px">' + esc(p.name.split(' ')[0]) + '</button>');
    b.onclick = function () { closeProj(); go('team', id); };
    tr.appendChild(b);
  });
  el.appendChild(scrim);
  el.appendChild(d);
}

/* ---------- render ---------- */
function render() {
  renderChrome();
  var v = document.getElementById('view');
  v.innerHTML = '';
  v.appendChild(state.view === 'dash' ? viewDash() : state.view === 'projects' ? viewProjects() : (state.sel ? viewPerson() : viewTeam()));
  renderOverlay();
}
render();
</script>
</body>
</html>
